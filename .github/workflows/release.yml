name: Publish extension release

on:
  push:
    branches: [main]
    paths:
      - ChatGPT-Exporter-English-Edge/manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: extension-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact triggering commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/$REPOSITORY.git"
          git fetch --depth=1 origin "$COMMIT"
          git checkout --detach FETCH_HEAD
      - name: Verify focused regression tests and runtime syntax
        run: |
          node --test tests/*.test.mjs
          for file in ChatGPT-Exporter-English-Edge/*.js ChatGPT-Exporter-English-Edge/*.mjs; do
            node --check "$file"
          done
      - name: Build and publish the versioned ZIP and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          node scripts/package-release.mjs
          VERSION=$(node -p "require('./ChatGPT-Exporter-English-Edge/manifest.json').version")
          TAG="ChatGPT$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; no published files were changed."
            exit 0
          fi
          gh release create "$TAG" --target "$COMMIT" --title "ChatGPT Exporter $VERSION" --notes-file "release-notes/v$VERSION.md" --draft
          gh release upload "$TAG" "dist/ChatGPT-Exporter-English-Edge-v$VERSION.zip" "dist/ChatGPT-Exporter-English-Edge-v$VERSION.zip.sha256.txt"
          gh release edit "$TAG" --draft=false --latest
